name: Build
 
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
 
permissions:
  contents: write
 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
 
      # Usa el Gradle indicado, asi no hace falta tener gradlew en el repo
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1
 
      - name: Build
        run: gradle build --no-daemon
 
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: pesadilla
          path: build/libs/*.jar
 
      # Al subir un tag (ej. v1.0.0) publica el .jar en Releases
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
 
